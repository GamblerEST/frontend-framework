<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot.js Test - Embedded</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 { color: #667eea; margin: 0 0 20px 0; }
    .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 6px; margin: 15px 0; }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover { background: #5568d3; }
    .counter {
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      margin: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Embed the entire framework inline
  </script>
  
  <script src="dist/dot.js"></script>

  <script>
    if (typeof Dot === 'undefined') {
      document.getElementById('app').innerHTML = `
        <div class="container">
          <h1>❌ Framework Not Found</h1>
          <p>The file <code>dist/dot.js</code> is missing or empty.</p>
        </div>
      `;
    } else {
      class TestApp extends DotComponent {
        constructor() {
          super();
          this.localState = { count: 0 };
          this.watch('globalCount');
        }

        render() {
          const globalCount = this.state.globalCount || 0;

          return dot.div({ class: 'container' },
            dot.h1({}, '✅ Framework Works!'),
            dot.div({ class: 'success' }, 'Dot.js loaded successfully'),
            
            dot.h2({}, 'Local Counter'),
            dot.div({ class: 'counter' }, String(this.localState.count)),
            dot.button({
              onClick: () => this.setState({ count: this.localState.count + 1 })
            }, '+ Increment'),
            
            dot.h2({}, 'Global Counter'),
            dot.div({ class: 'counter' }, String(globalCount)),
            dot.button({
              onClick: () => Dot.store.set('globalCount', globalCount + 1)
            }, '+ Increment Global')
          );
        }
      }

      Dot.init({
        routes: { '/': TestApp },
        initialState: { globalCount: 0 },
        persist: true
      });
    }
  </script>
</body>
</html>
